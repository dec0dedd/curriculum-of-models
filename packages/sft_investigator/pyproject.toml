[project]
name = "sft-investigator"
version = "0.1.0"
description = "Tinker SFT: the investigator warm start the Black-box baseline resumes from, and the gpt-oss refusal LoRA exported for vLLM."
requires-python = ">=3.12"
dependencies = [
    "common",
    "click>=8.1",
    "datasets>=4.8.5",
    "python-dotenv",
    "rich",
    "tinker>=0.25.0,<0.26",
    "tinker-cookbook>=0.5.4,<0.6",
    "wandb",
]


[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.15"]

[tool.uv.sources]
common = { path = "../common", editable = true }

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
